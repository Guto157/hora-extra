name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix Gradle
        run: |
          flutter create -t app fix_temp
          cp -r lib fix_temp/lib
          cp pubspec.yaml fix_temp/pubspec.yaml
          rm -rf android lib
          cp -r fix_temp/android ./
          cp -r fix_temp/lib ./
          rm -rf fix_temp
          # Renomeia app ao instalar
          sed -i 's/android:label="hora_extra"/android:label="Calculadora de Hora Extra"/g' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Hora-Extra-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
