name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix Gradle e Nome
        run: |
          flutter create -t app fix_temp
          cp lib/main.dart fix_temp/lib/main.dart
          cp pubspec.yaml fix_temp/pubspec.yaml
          rm -rf android lib
          mv fix_temp/android ./
          mv fix_temp/lib ./
          rm -rf fix_temp
          sed -i 's/android:label=".*"/android:label="Calculadora Hora Extra"/g' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Hora-Extra-CALENDARIO
          path: build/app/outputs/flutter-apk/app-release.apk
