name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: |
          flutter create -t app temp_fix
          cp -r lib temp_fix/; cp pubspec.yaml temp_fix/; rm -rf lib android; cp -r temp_fix/lib .; cp -r temp_fix/android .; cp temp_fix/pubspec.yaml .; rm -rf temp_fix
          sed -i 's/android:label="hora_extra"/android:label="Calculadora de Hora Extra"/g' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Calculadora-de-Hora-Extra-V3-MANUAL
          path: build/app/outputs/flutter-apk/app-release.apk
